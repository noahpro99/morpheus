[package]
name = "morpheus-mobile"
description = "Morpheus mobile app (Dioxus mobile renderer)."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The in-app test bridge, for driving the app on an emulator (`just e2e-android`).
e2e = ["morpheus-ui/e2e"]

[dependencies]
dioxus = { workspace = true, features = ["mobile"] }
morpheus-ui = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
morpheus-core = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "time"] }
ndk-context = "0.1"
morpheus-call = { workspace = true }
jni = "0.21"

[lints.rust]
# The workspace forbids unsafe code; the Android data-dir lookup needs two
# raw-pointer wraps (see src/main.rs), so this crate warns instead and
# allows them in that one function.
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[build-dependencies]
webrtc-sys-build = "0.3.19"
