[application]
name = "morpheus"

[bundle]
identifier = "dev.morpheus.mobile"
publisher = "Morpheus"

[android.permissions]
"android.permission.VIBRATE" = { description = "A short buzz when press-and-hold opens a menu" }
"android.permission.POST_NOTIFICATIONS" = { description = "Notifications for new messages" }
"android.permission.RECORD_AUDIO" = { description = "Your voice in calls" }
"android.permission.MODIFY_AUDIO_SETTINGS" = { description = "Speaker and earpiece switching in calls" }

[android]
# UnifiedPush: the app registers with the phone's push app (Sunup, ntfy, …).
# 3.0.x: later releases are built with Kotlin 2.2+, which dx 0.7's Kotlin 2.0
# compiler cannot read.
gradle_dependencies = ["org.unifiedpush.android:connector:3.0.10"]
