[package]
name = "morpheus-desktop-gpui"
description = "Morpheus desktop app (GPUI renderer, port in progress)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "morpheus-gpui"
path = "src/main.rs"

[features]
# The test bridge (`MORPHEUS_E2E_PORT`) and element tags; never in a release.
e2e = ["dep:serde", "dep:base64"]

[dependencies]
gpui = "0.2"
anyhow = { workspace = true }
morpheus-core = { workspace = true }
morpheus-view-model = { workspace = true }
directories = { workspace = true }
futures = "0.3"
morpheus-call = { workspace = true }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
image = { version = "0.25", default-features = false }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
ruma-html = { workspace = true }
base64 = { workspace = true, optional = true }
jiff = "0.2"
emojis = "0.9.1"

[dev-dependencies]
gpui = { version = "0.2", features = ["test-support"] }

[lints]
workspace = true
