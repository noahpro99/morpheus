[package]
name = "morpheus-desktop-gpui"
description = "Morpheus desktop app (GPUI renderer, port in progress)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "morpheus-gpui"
path = "src/main.rs"

[features]
# The test bridge (`MORPHEUS_E2E_PORT`) and element tags; never in a release.
e2e = ["dep:futures", "dep:serde", "dep:serde_json"]

[dependencies]
gpui = "0.2"
anyhow = { workspace = true }
morpheus-core = { workspace = true }
directories = { workspace = true }
futures = { version = "0.3", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[lints]
workspace = true
