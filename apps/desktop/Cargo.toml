[package]
name = "morpheus-desktop"
description = "Morpheus desktop app (GPUI)."
version.workspace = true
edition.workspace = true
license.workspace = true
# `cargo run` (and `cargo r`) start the app, not the e2e build below.
default-run = "morpheus-desktop"

[[bin]]
name = "morpheus-desktop"
path = "src/main.rs"

# The same program with the test bridge, as its own binary, so building it
# (`just e2e-build`) never replaces target/debug/morpheus-desktop, which a
# developer may be running. Cargo warns that main.rs is in two targets: it is
# meant to be.
[[bin]]
name = "morpheus-desktop-e2e"
path = "src/main.rs"
required-features = ["e2e"]

[features]
# The test bridge (`MORPHEUS_E2E_PORT`) and element tags; never in a release.
e2e = ["dep:serde"]
# A build for heap profiling (slower; replaces mimalloc). Never in a release.
dhat-heap = ["dep:dhat"]
# macOS: GPUI compiles its Metal shaders when the app starts, not while building
# (for a runner whose Xcode has no Metal compiler; apple.yml).
runtime-shaders = ["gpui/runtime_shaders"]

[dependencies]
gpui = "0.2"
anyhow = { workspace = true }
morpheus-core = { workspace = true }
morpheus-view-model = { workspace = true }
directories = { workspace = true }
futures = "0.3"
morpheus-call = { workspace = true }
morpheus-video = { workspace = true }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
image = { version = "0.25", default-features = false }
notify-rust = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
ruma-html = { workspace = true }
base64 = { workspace = true }
jiff = "0.2"
emojis = "0.9.1"
png = { workspace = true }
tokio = { workspace = true }
# Returns freed memory to the system (glibc's malloc kept ~130 MB freed after scrolling a big room).
mimalloc = { version = "0.1", default-features = false }
# Heap profiling (issue #10): `--features dhat-heap` swaps the allocator for dhat's; the e2e bridge's `heap_dump` writes the profile.
dhat = { version = "0.3", optional = true }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
gpui = { version = "0.2", features = ["test-support"] }

[build-dependencies]
embed-resource = "3"

[lints.rust]
# The workspace forbids unsafe code; the Windows taskbar badge (src/win_badge.rs)
# is a few COM and GDI calls, so this crate denies it instead and allows it there.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }

# Windows and macOS: the notification-area / menu-bar icon (Linux speaks
# StatusNotifierItem through ksni above).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.21", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-registry = "0.5"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Storage_EnhancedStorage", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"

# SIGTERM (logout, shutdown, `kill`) quits as the Quit item does: hanging up first.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3.18"

# macOS: the Dock tile's badge.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
