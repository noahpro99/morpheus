[package]
name = "morpheus-desktop"
description = "Morpheus desktop app (Dioxus webview renderer)."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Enables the in-app test bridge used by `just e2e`.
e2e = ["morpheus-ui/e2e"]

[dependencies]
# The ringtone, heard with the window in the tray (its page is suspended).
rodio = { version = "0.23", default-features = false, features = ["playback"] }
dioxus = { workspace = true, features = ["desktop"] }
morpheus-ui = { workspace = true }
morpheus-core = { workspace = true }
directories = { workspace = true }
notify-rust = { workspace = true }
png = { workspace = true }
serde_json = { workspace = true }
# Returns freed memory to the system (glibc's malloc kept ~130 MB freed after scrolling a big room).
mimalloc = { version = "0.1", default-features = false }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
