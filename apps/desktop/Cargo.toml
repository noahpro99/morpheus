[package]
name = "morpheus-desktop"
description = "Morpheus desktop app (GPUI)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "morpheus-desktop"
path = "src/main.rs"

[features]
# The test bridge (`MORPHEUS_E2E_PORT`) and element tags; never in a release.
e2e = ["dep:serde"]

[dependencies]
gpui = "0.2"
anyhow = { workspace = true }
morpheus-core = { workspace = true }
morpheus-view-model = { workspace = true }
directories = { workspace = true }
futures = "0.3"
morpheus-call = { workspace = true }
rodio = { version = "0.23", default-features = false, features = ["playback"] }
image = { version = "0.25", default-features = false }
notify-rust = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
ruma-html = { workspace = true }
base64 = { workspace = true }
jiff = "0.2"
emojis = "0.9.1"
png = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
gpui = { version = "0.2", features = ["test-support"] }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
