[workspace]
resolver = "3"
members = ["crates/core", "crates/call", "crates/ui", "crates/e2e", "apps/desktop", "apps/mobile"]
# `cargo build` / `cargo test` cover desktop by default; mobile builds via `dx`.
default-members = ["crates/core", "crates/ui", "apps/desktop"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/noahpro/morpheus"

[workspace.dependencies]
morpheus-core = { path = "crates/core" }
morpheus-ui = { path = "crates/ui" }
morpheus-call = { path = "crates/call" }

matrix-sdk = { version = "0.19.1", features = ["markdown", "sso-login", "experimental-search", "qrcode"] }
matrix-sdk-ui = "0.19.1"
dioxus = "0.7.10"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "fs"] }
futures-util = "0.3"
eyeball-im = "0.9"
imbl = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
anyhow = "1"
base64 = "0.22"
ruma-html = "0.9"
mime_guess = "2"
rfd = "0.17"
open = "5"
notify-rust = "4"
keyring = "4"
rand = "0.9"
chacha20poly1305 = "0.11"
tempfile = "3"
png = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
# Debug info is most of a release binary (178 MB → 123 MB without); function
# names stay, for readable backtraces.
strip = "debuginfo"

# Our crates compile fast; the heavy dependencies (matrix-sdk, crypto, webview) get optimised once.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# dx builds phone apps with this profile. Full debug info made a 1 GB APK
# that no longer fits an emulator's data partition; line tables keep
# backtraces readable for our crates.
[profile.android-dev]
inherits = "dev"
debug = "line-tables-only"

[profile.android-dev.package."*"]
debug = false
