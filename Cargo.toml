[workspace]
resolver = "3"
members = ["crates/core", "crates/call", "crates/view-model", "crates/ui", "crates/e2e", "apps/desktop", "apps/mobile", "apps/web"]
# `cargo build` / `cargo test` cover desktop by default; mobile builds via `dx`.
default-members = ["crates/core", "apps/desktop"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/noahpro/morpheus"

[workspace.dependencies]
morpheus-core = { path = "crates/core" }
morpheus-ui = { path = "crates/ui" }
morpheus-call = { path = "crates/call" }
morpheus-view-model = { path = "crates/view-model" }

# Shared by every platform; the stores and logins are added per target in
# crates/core (a browser has IndexedDB, and no local server for SSO).
matrix-sdk = { version = "0.19.1", default-features = false, features = ["e2e-encryption", "automatic-room-key-forwarding", "markdown", "qrcode"] }
matrix-sdk-ui = "0.19.1"
dioxus = "0.7.10"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "fs"] }
futures-util = "0.3"
eyeball-im = "0.9"
imbl = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
anyhow = "1"
base64 = "0.22"
ruma-html = "0.9"
mime_guess = "2"
rfd = "0.17"
open = "5"
notify-rust = "4"
keyring = "4"
rand = "0.9"
chacha20poly1305 = "0.11"
tempfile = "3"
png = "0.17"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
# Debug info is most of a release binary (178 MB → 123 MB without); function
# names stay, for readable backtraces.
strip = "debuginfo"

# Our crates compile fast; the heavy dependencies (matrix-sdk, crypto, webview) get optimised once.
[profile.dev]
opt-level = 1
# Line tables only: panics and backtraces keep file and line; full debug
# info (dependencies' generics compiled into our crates) was 600 MB more
# to link and for dx to rewrite.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
# No debug info for dependencies: it was 1.9 GB of a 2.2 GB desktop binary,
# which every build links and dx then reads and rewrites (up to two
# minutes). Our crates keep theirs; backtraces still name dependencies'
# functions.
debug = false

# dx builds phone apps with this profile. No debug info: full debug info
# made a 1 GB APK that no longer fits an emulator's data partition, and even
# line tables were 170 MB of the 470 MB library every build packs into the
# APK. Function names stay, so backtraces still name the functions.
[profile.android-dev]
inherits = "dev"
debug = false
strip = "debuginfo"

[profile.android-dev.package."*"]
debug = false

# dx builds the web app with this profile. Full debug info made a 1 GB
# module that wasm-bindgen could not get through.
[profile.wasm-dev]
inherits = "dev"
debug = false

[profile.wasm-dev.package."*"]
debug = false

# xattr 0.2.3 (a dependency of GPUI's tar) names libc::ENOATTR, which libc
# dropped for Linux; the copy in vendor/xattr uses ENODATA (what it was).
[patch.crates-io]
xattr = { path = "vendor/xattr" }
# GPUI 0.2.1 returns a pub(crate) type from the public Window::dispatch_event,
# so no outside code can call it; vendor/gpui makes DispatchEventResult pub
# (the only change) for the e2e bridge's mouse input.
gpui = { path = "vendor/gpui" }
