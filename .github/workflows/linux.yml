# The desktop app for Linux (x86-64), zipped as the updater expects:
# morpheus-<version>-linux-x86_64.zip, one folder holding morpheus-desktop
# (its fonts and images are inside it). Built on an older Ubuntu so it runs on
# most distributions from that one on (a build in `nix develop` would only
# run where Nix is): it loads the window system's, Vulkan's and the sound
# server's libraries at run time. The update is tried on the built zip
# (scripts/update-self-test.sh). On a release tag it is attached to that
# release; run by hand, to the release named in `tag` (if any).
name: Linux

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to attach the build to (e.g. v0.2.0); empty to only keep it as a run artifact
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Libraries
        run: |
          sudo apt-get update
          # nasm: OpenH264's x86 assembly (videos; plain C without it).
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev \
            libx11-dev libxext-dev libxfixes-dev libxdamage-dev libxrandr-dev libxcomposite-dev libxtst-dev \
            libfontconfig-dev libfreetype-dev libvulkan-dev libgl-dev libdrm-dev libgbm-dev \
            libssl-dev libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev \
            pkg-config cmake zip python3 nasm
          # libwebrtc (calls) is built against Chromium's libc++ and needs a
          # recent clang, as in the dev shell.
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          echo "CC_x86_64_unknown_linux_gnu=clang-21" >> "$GITHUB_ENV"
          echo "CXX_x86_64_unknown_linux_gnu=clang++-21" >> "$GITHUB_ENV"
          # webrtc-sys runs a plain `clang++`: make that this clang.
          echo "/usr/lib/llvm-21/bin" >> "$GITHUB_PATH"

      - name: Rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x86_64

      - name: Build
        run: cargo build --release -p morpheus-desktop --locked

      - name: Package
        run: echo "RELEASE_ZIP=$(scripts/package-linux.sh | tail -1)" >> "$GITHUB_ENV"

      # Update on this platform: the installed zip finds a newer release on a
      # local feed, swaps itself for it, and the new one starts and cleans up.
      - name: Update works
        run: scripts/update-self-test.sh "$RELEASE_ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: ${{ env.RELEASE_ZIP }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" "$RELEASE_ZIP" --clobber
