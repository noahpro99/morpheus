# The Windows build of the desktop app: a zip (Morpheus.exe and its assets)
# for each release tag, attached to that release; or run by hand to try it.
name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The toolchain rust-toolchain.toml names, installed by rustup itself.
      - name: Rust
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release

      # aws-lc (rustls, for the Matrix SDK) assembles with NASM on Windows.
      - uses: ilammy/setup-nasm@v1

      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        run: cargo binstall -y dioxus-cli@0.7.10

      - name: Build
        run: dx build --package morpheus-desktop --release

      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app=target/dx/morpheus-desktop/release/windows/app
          ls -la "$app"
          name="morpheus-$version-windows-x86_64"
          mkdir -p "dist/$name"
          cp -r "$app"/. "dist/$name/"
          (cd dist && 7z a "$name.zip" "$name" > /dev/null)
          echo "ZIP=dist/$name.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ env.ZIP }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber
