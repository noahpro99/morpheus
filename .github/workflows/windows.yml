# The desktop app for Windows (x86-64), built natively here so a release does
# not depend on one person's machine (scripts/release-windows.sh cross-builds
# the same zip on Linux): morpheus-<version>-windows-x86_64.zip, one folder
# holding the launcher Morpheus.exe and app/morpheus-desktop.exe. The update is tried on the built zip
# (scripts/update-self-test.sh). On a release tag it is attached to that
# release; run by hand, to the release named in `tag` (if any).
name: Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to attach the build to (e.g. v0.2.0); empty to only keep it as a run artifact
        required: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      # LiveKit's WebRTC is built with the static C runtime; so is the rest
      # (and then the app needs no Visual C++ redistributable).
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v5

      - name: Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-pc-windows-msvc

      - name: Vendored crates as members
        run: scripts/ci-cache.sh vendor-members
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-x86_64
          # Only main saves: tags and hand runs read it, so the 10 GB limit holds one
          # cache per platform.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspace-crates: true
          cache-directories: .warm

      # What the cache was built at: files unchanged since then keep an old time, so Cargo
      # does not rebuild the vendored and workspace crates (#358).
      - name: Cache file times
        run: scripts/ci-cache.sh restore-mtimes

      # OpenH264 (videos) uses its x86 assembly when nasm is on the PATH and
      # plain C otherwise; the runner does not have it.
      - name: NASM
        run: |
          choco install nasm -y --no-progress || true
          echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"

      # GPUI compiles its shaders with fxc.exe from the Windows SDK, which
      # the runner has; the build script finds it through where.exe or its
      # default path.
      - name: Build
        run: cargo build --release -p morpheus-desktop -p morpheus-launcher --locked --target x86_64-pc-windows-msvc

      # One title bar (#97): no system caption above the app's, its buttons
      # the caption's (snap layouts), the bar the caption, maximised on the
      # work area exactly.
      - name: Window chrome
        shell: pwsh
        run: scripts/windows-chrome-check.ps1 target/x86_64-pc-windows-msvc/release/morpheus-desktop.exe

      # The camera path (#74), as the app takes it: Media Foundation loaded,
      # the cameras listed, and with one, opened as the Settings preview
      # opens it, read for a few seconds and let go. The runner has no
      # camera (and a virtual one needs a signed driver or a custom media
      # source), so here it proves the listing runs and reports zero without
      # crashing; on a laptop the same command checks the whole path.
      - name: Camera
        run: |
          out="$RUNNER_TEMP/camera-self-test.txt"
          code=0
          MORPHEUS_CAMERA_SELF_TEST=3 MORPHEUS_CAMERA_SELF_TEST_OUT="$out" \
            timeout 120 target/x86_64-pc-windows-msvc/release/morpheus-desktop.exe || code=$?
          cat "$out" || true
          test "$code" -eq 0
          grep -q "^camera self-test: ok: Media Foundation: " "$out"

      # Diagnostics (#103): what needs no window: memory read from the
      # system, the Windows build, window system, matrix-sdk version.
      - name: Diagnostics
        run: |
          out="$RUNNER_TEMP/diagnostics-self-test.txt"
          MORPHEUS_DIAGNOSTICS_SELF_TEST="$out" \
            target/x86_64-pc-windows-msvc/release/morpheus-desktop.exe
          cat "$out"
          ! grep -q "^Memory (working set): 0 B" "$out"
          ! grep -q "^Kernel: unknown" "$out"
          grep -q "^Kernel: Windows " "$out"
          grep -q "^Window system: Win32" "$out"
          ! grep -q "^matrix-sdk: unknown" "$out"
          grep -q "^Hardware video: " "$out"
          grep -q "^Hardware decoder: " "$out"

      # The GPU diagnostics name the adapter that draws (#277): the app's
      # window opened for a few seconds on the runner (software adapter: WARP).
      - name: GPU named
        shell: bash
        run: |
          out="$RUNNER_TEMP/gpu-self-check.txt"
          MORPHEUS_TITLEBAR_SHOT=8 MORPHEUS_TITLEBAR_SHOT_OUT="$out" MORPHEUS_DATA_DIR="$(mktemp -d)" \
            target/x86_64-pc-windows-msvc/release/morpheus-desktop.exe || true
          cat "$out"
          grep -q "^gpu self-check: ok: " "$out"

      # Hardware video (#102): which encoder and decoder libwebrtc found, 30
      # pictures through Media Foundation's H.264 encoders, and the software
      # encoder's pictures through the Media Foundation decoder. The runner
      # has no GPU, so the hardware ones are "unavailable"; Microsoft's
      # software MFTs run the same classes (the encoder sync rather than
      # async, the decoder without a Direct3D device). The decode checks
      # count, size and pixels. A failed encode or decode says "error:" and
      # exits 1.
      - name: Video encoders and decoders
        run: |
          out="$RUNNER_TEMP/video-encoder-self-test.txt"
          code=0
          MORPHEUS_VIDEO_ENCODER_SELF_TEST="$out" \
            timeout 120 target/x86_64-pc-windows-msvc/release/morpheus-desktop.exe || code=$?
          cat "$out" || true
          test "$code" -eq 0
          grep -q "^hardware encoder: " "$out"
          grep -q "^media foundation hardware: " "$out"
          grep -Eq "^media foundation software: (ok|unavailable): " "$out"
          grep -q "^hardware decoder: " "$out"
          grep -Eq "^media foundation decode hardware: (ok|unavailable): " "$out"
          grep -q "^media foundation decode software: ok: " "$out"

      - name: Package
        run: echo "RELEASE_ZIP=$(scripts/package-windows.sh | tail -1)" >> "$GITHUB_ENV"

      # Update on this platform: the installed zip finds a newer release on a
      # local feed and swaps the files of its app/ (Windows lets a running
      # program be renamed, not deleted), leaving the launcher Morpheus.exe
      # (what a taskbar pin points at) untouched; the launcher then starts the
      # new version. An old single-program install migrates to the launcher
      # layout the same way (#186).
      # Restart Morpheus goes through that launcher too, after the old process
      # has ended (#232).
      - name: Update works
        run: scripts/update-self-test.sh "$RELEASE_ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: ${{ env.RELEASE_ZIP }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" "$RELEASE_ZIP" --clobber
