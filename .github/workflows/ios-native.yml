# The native iPhone app (apps/ios, #520): lint and spec rules (fast, first), then the Rust XCFramework, the app and the
# XCUITests on a simulator against a Synapse started in the job, in parallel with the device build (an unsigned .ipa).
# Fast-CI rules (#358): cargo and SPM caches, the simulator boots and Synapse installs while Rust builds.
name: iOS native

on:
  push:
    branches: [main]
    paths: &paths
      - "apps/ios/**"
      - "crates/**"
      - Cargo.toml
      - Cargo.lock
      - scripts/ios-ffi.sh
      - .github/workflows/ios-native.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Source rules (HIG)
        run: |
          rustc --edition 2021 --test apps/ios/rules/ios_rules.rs -o ios_rules
          ./ios_rules
      - name: SwiftLint
        run: |
          which swiftlint || brew install swiftlint
          cd apps/ios && swiftlint lint --strict

  test:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))][0].udid')
          echo "SIM=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" &

      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-synapse-${{ runner.os }}
      - name: Homeserver (Synapse, seeded)
        run: python3 apps/ios/ci/homeserver.py start "$RUNNER_TEMP/hs"

      - name: Rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-sim
          cache-on-failure: true
      - name: XCFramework (simulator) and Swift bindings
        run: scripts/ios-ffi.sh aarch64-apple-ios-sim

      - name: Xcode project
        run: |
          which xcodegen || brew install xcodegen
          cd apps/ios && xcodegen generate

      - name: XCUITests
        run: |
          cd apps/ios
          xcodebuild test -project Morpheus.xcodeproj -scheme Morpheus -destination "id=$SIM" \
            -clonedSourcePackagesDirPath ~/spm -resultBundlePath "$RUNNER_TEMP/result.xcresult" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO | tail -150

      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ${{ runner.temp }}/result.xcresult
          retention-days: 7
      - name: Homeserver log
        if: failure()
        run: tail -50 "$RUNNER_TEMP/hs/synapse.log" || true

  device:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-device
          cache-on-failure: true
      - name: XCFramework (device) and Swift bindings
        run: scripts/ios-ffi.sh aarch64-apple-ios
      - name: Unsigned .ipa
        run: |
          which xcodegen || brew install xcodegen
          cd apps/ios && xcodegen generate
          xcodebuild build -project Morpheus.xcodeproj -scheme Morpheus -sdk iphoneos -configuration Release \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tail -40
          mkdir -p build/ipa/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/Morpheus.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Morpheus-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: Morpheus-unsigned-ipa
          path: apps/ios/build/Morpheus-unsigned.ipa
          retention-days: 14
