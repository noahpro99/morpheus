# The native iPhone app (apps/ios, #520): lint and spec rules (fast, first), then the Rust XCFramework, the app and the
# XCUITests on a simulator against a Synapse started in the job, in parallel with the device build (an unsigned .ipa).
# Fast-CI rules (#358): cargo and SPM caches, the simulator boots and Synapse installs while Rust builds.
name: iOS native

on:
  push:
    branches: [main]
    paths: &paths
      - "apps/ios/**"
      - "crates/**"
      - Cargo.toml
      - Cargo.lock
      - scripts/ios-ffi.sh
      - .github/workflows/ios-native.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ios-native-${{ github.sha }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Source rules (HIG)
        run: |
          rustc --edition 2021 --test apps/ios/rules/ios_rules.rs -o ios_rules
          ./ios_rules
      - name: SwiftLint
        run: |
          which swiftlint || brew install swiftlint
          cd apps/ios && swiftlint lint --strict

  test:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))][0].udid')
          echo "SIM=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" &

      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-synapse-${{ runner.os }}
      # In the background: installing Synapse and seeding take minutes, the Rust build needs none of it.
      - name: Homeserver (Synapse, seeded), started
        run: nohup python3 apps/ios/ci/homeserver.py start "$RUNNER_TEMP/hs" > "$RUNNER_TEMP/hs.out" 2>&1 &

      - name: Rust
        run: |
          v=$(sed -n "s/^channel = \"\(.*\)\"/\1/p" rust-toolchain.toml)
          for i in 1 2 3 4 5; do
            rustup toolchain install "$v" --profile minimal --no-self-update && RUSTUP_TOOLCHAIN="$v" cargo --version && break
            rustup toolchain uninstall "$v" || true
            sleep 10
          done
          echo "RUSTUP_TOOLCHAIN=$v" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-sim
          cache-workspace-crates: true
          cache-on-failure: true
      - name: XCFramework (simulator) and Swift bindings
        run: IOS_FAST=1 scripts/ios-ffi.sh aarch64-apple-ios-sim

      - name: Xcode project
        run: |
          which xcodegen || brew install xcodegen
          cd apps/ios && xcodegen generate

      - name: Homeserver ready
        run: for _ in $(seq 300); do grep -q seeded "$RUNNER_TEMP/hs.out" && exit 0; sleep 2; done; cat "$RUNNER_TEMP/hs.out"; exit 1

      - name: XCUITests
        shell: bash
        run: |
          cd apps/ios
          xcodebuild test -project Morpheus.xcodeproj -scheme Morpheus -destination "id=$SIM" \
            -clonedSourcePackagesDirPath ~/spm -resultBundlePath "$RUNNER_TEMP/result.xcresult" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300 \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | grep -E "Test Case|error:|\*\* TEST|Executed|AUDIT"

      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: ${{ runner.temp }}/result.xcresult
          retention-days: 7
      - name: Homeserver log
        if: failure()
        run: |
          grep -A60 "accessibility tree" "$RUNNER_TEMP/xcodebuild.log" | head -150 || true
          tail -30 "$RUNNER_TEMP/hs/synapse.log" || true
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | head; cat ~/Library/Logs/DiagnosticReports/Morpheus*.ips 2>/dev/null | head -60 || true

  device:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Rust
        run: |
          v=$(sed -n "s/^channel = \"\(.*\)\"/\1/p" rust-toolchain.toml)
          for i in 1 2 3 4 5; do
            rustup toolchain install "$v" --profile minimal --no-self-update && RUSTUP_TOOLCHAIN="$v" cargo --version && break
            rustup toolchain uninstall "$v" || true
            sleep 10
          done
          echo "RUSTUP_TOOLCHAIN=$v" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ios-device
          cache-workspace-crates: true
          cache-on-failure: true
      - name: XCFramework (device) and Swift bindings
        run: scripts/ios-ffi.sh aarch64-apple-ios
      - name: Unsigned .ipa
        run: |
          which xcodegen || brew install xcodegen
          cd apps/ios && xcodegen generate
          xcodebuild build -project Morpheus.xcodeproj -scheme Morpheus -sdk iphoneos -configuration Release \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tail -40
          mkdir -p build/ipa/Payload
          cp -R build/dd/Build/Products/Release-iphoneos/Morpheus.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../Morpheus-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: Morpheus-unsigned-ipa
          path: apps/ios/build/Morpheus-unsigned.ipa
          retention-days: 14
