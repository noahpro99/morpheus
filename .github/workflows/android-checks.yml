# The Android spec checks that never run the app (#468): Android Lint with the Compose and
# Material 3 checks, compose-rules (detekt), our own source rules, the accessibility checks and the
# Roborazzi screenshot tests. All on the JVM, no emulator. Runs beside the other workflows (not
# after them), only when Android or the Rust API it binds to changed, and keeps to the fast-CI
# rules (#358): the Kotlin bindings and host library are cached by a hash of the Rust sources (a Kotlin-only
# change never runs cargo; a Rust change builds incrementally on a Rust cache of its own), Gradle's caches are kept,
# and the app's cross-compile is skipped: the bindings come from a host build of crates/ffi and WebRTC's Java half
# is a stub (scripts/android-check-prep.sh).
name: Android checks

on:
  push:
    branches: [main]
    paths: &paths
      - "apps/android/**"
      - "crates/ffi/**"
      - "crates/core/**"
      - "crates/view-model/**"
      - "crates/call/**"
      - Cargo.toml
      - Cargo.lock
      - scripts/android-check-prep.sh
      - scripts/ci-linux-deps.sh
      - .github/workflows/android-checks.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: android-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ANDROID_CHECK_PROFILE: release
    steps:
      - uses: actions/checkout@v5

      # First and alone: it needs only rustc, so a rule broken fails in seconds, before anything is built.
      - name: Source rules
        run: |
          rustc --edition 2021 --test crates/view-model/src/android_rules.rs -o android_rules
          ./android_rules

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.4
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The bindings and the host library change only when Rust does: kept by the hash of its sources, so most runs
      # (Kotlin-only changes) skip cargo entirely. On a miss the build is incremental on its own saved Rust cache.
      - name: Kotlin bindings (cached)
        id: bindings
        uses: actions/cache@v4
        with:
          path: target/android-checks
          key: android-bindings-${{ hashFiles('crates/ffi/**', 'crates/core/**', 'crates/view-model/**', 'crates/call/**', 'vendor/**', 'Cargo.lock', 'scripts/android-check-prep.sh') }}

      - name: Libraries
        if: steps.bindings.outputs.cache-hit != 'true'
        run: scripts/ci-linux-deps.sh

      - name: Rust
        if: steps.bindings.outputs.cache-hit != 'true'
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        if: steps.bindings.outputs.cache-hit != 'true'
        with:
          shared-key: android-ffi
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-workspace-crates: true

      - name: Kotlin bindings
        if: steps.bindings.outputs.cache-hit != 'true'
        run: scripts/android-check-prep.sh

      - name: Lint, compose-rules, our rules
        working-directory: apps/android
        run: gradle lintDebug detekt -PrustPrebuilt=$GITHUB_WORKSPACE/target/android-checks

      - name: Screenshots and accessibility checks
        working-directory: apps/android
        run: gradle verifyRoborazziDebug --tests "*ScreenShots*" -PrustPrebuilt=$GITHUB_WORKSPACE/target/android-checks
        env:
          ANDROID_CHECK_PROFILE: release
