# The Apple builds (Apple's SDKs are only licensed for Apple hardware, so
# they are built on GitHub's Macs rather than cross-built like Windows):
# Morpheus.app for macOS (the GPUI desktop app, built with cargo and bundled
# by scripts/package-macos.sh), ad-hoc signed and zipped, for Apple silicon
# and Intel; and an unsigned .ipa for iPhone (the Dioxus phone app). On a
# release tag they are attached to that release; run by hand, to the release
# named in `tag` (if any).
name: Apple

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to attach the builds to (e.g. v0.2.0); empty to only keep them as run artifacts
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v5

      - name: Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      # GPUI compiles its Metal shaders while building (xcrun metal). Newer
      # Xcodes ship the Metal compiler as a separate download; if it still is
      # not there, GPUI compiles the shaders when the app starts instead.
      - name: Metal compiler
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain || true
          fi
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "FEATURES=" >> "$GITHUB_ENV"
          else
            echo "No Metal compiler: using GPUI's runtime shaders"
            echo "FEATURES=--features runtime-shaders" >> "$GITHUB_ENV"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-${{ matrix.target }}

      # OpenH264 (videos): x86 assembly for the Intel build when nasm is
      # there (plain C otherwise); the Arm build uses its NEON code as is.
      - name: NASM
        if: matrix.arch == 'x86_64'
        run: brew install nasm || true

      - name: Build
        run: cargo build --release -p morpheus-desktop --locked --target ${{ matrix.target }} $FEATURES

      - name: Package
        run: echo "RELEASE_ZIP=$(scripts/package-macos.sh ${{ matrix.target }} ${{ matrix.arch }} | tail -1)" >> "$GITHUB_ENV"

      # The app has to get past loading: a link that drops libwebrtc's
      # Objective-C aborts it before main. (The Intel build runs under
      # Rosetta on the Apple-silicon runner.)
      - name: Starts
        run: |
          if [ "${{ matrix.arch }}" = x86_64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "No Rosetta on this runner; not started"; exit 0
          fi
          rm -rf smoke && mkdir smoke && ditto -x -k "$RELEASE_ZIP" smoke
          exe=smoke/Morpheus.app/Contents/MacOS/morpheus-desktop
          MORPHEUS_DATA_DIR="$PWD/smoke/data" "$exe" > smoke/log.txt 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Morpheus quit within 20s:"; cat smoke/log.txt
            ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i morpheus && \
              head -40 ~/Library/Logs/DiagnosticReports/*morpheus* 2>/dev/null
            exit 1
          fi
          kill "$pid"
          echo "Morpheus is running after 20s"; tail -5 smoke/log.txt

      # As a Mac user expects it: its icon, an Edit menu that pastes, ⌘W
      # closing the window, and the Dock bringing it back.
      - name: Behaves as a Mac app
        if: matrix.arch == 'arm64'
        timeout-minutes: 10
        run: |
          sleep 2
          bash scripts/mac-check.sh smoke/Morpheus.app

      # Update on this platform: the installed bundle finds a newer release
      # on a local feed, swaps itself for it, and the new one starts.
      - name: Update works
        if: matrix.arch == 'arm64'
        run: scripts/update-self-test.sh "$RELEASE_ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: ${{ env.RELEASE_ZIP }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" "$RELEASE_ZIP" --clobber

  # The phone app for iPhone: an unsigned .ipa (Apple only installs apps
  # signed for the device; AltStore or SideStore sign it with the
  # installer's own Apple ID).
  ios:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-apple-ios
          # dx strips with rustup's rust-objcopy, which looks for libLLVM
          # beside itself; the toolchain has it one level up.
          sysroot=$(rustc --print sysroot)
          host=$(rustc -vV | sed -n 's/^host: //p')
          rustup component add llvm-tools
          mkdir -p "$sysroot/lib/rustlib/$host/lib"
          for lib in "$sysroot"/lib/libLLVM*.dylib; do ln -sf "$lib" "$sysroot/lib/rustlib/$host/lib/libLLVM.dylib"; done
          ls -la "$sysroot/lib/rustlib/$host/lib/" | grep -i llvm || true

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ios

      - uses: cargo-bins/cargo-binstall@main
      - name: Dioxus CLI
        run: cargo binstall -y dioxus-cli@0.7.10

      - name: Build
        run: dx build --release --package morpheus-mobile --platform ios --target aarch64-apple-ios

      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app=$(find target/dx/morpheus-mobile/release/ios -maxdepth 2 -name '*.app' | head -1)
          echo "app: $app"; ls -la "$app"
          mkdir -p dist/Payload
          cp -R "$app" dist/Payload/Morpheus.app
          plist=dist/Payload/Morpheus.app/Info.plist
          set_key() { /usr/libexec/PlistBuddy -c "Set :$1 $2" "$plist" 2>/dev/null || /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$plist"; }
          set_key NSMicrophoneUsageDescription "Morpheus uses the microphone in calls."
          set_key NSCameraUsageDescription "Morpheus uses the camera in video calls."
          set_key CFBundleDisplayName Morpheus
          ipa="dist/morpheus-$version-ios-arm64-unsigned.ipa"
          (cd dist && zip -qr "../$ipa" Payload)
          ls -la "$ipa"
          echo "IPA=$ipa" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ${{ env.IPA }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" "$IPA" --clobber
