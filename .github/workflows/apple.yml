# The Apple builds (Apple's SDKs are only licensed for Apple hardware, so
# they are built on GitHub's Macs rather than cross-built like Windows):
# Morpheus.app for macOS (the GPUI desktop app, built with cargo and bundled
# by scripts/package-macos.sh), ad-hoc signed and zipped, for Apple silicon
# and Intel; and an unsigned .ipa for iPhone (the Dioxus phone app). On a
# release tag they are attached to that release; run by hand, to the release
# named in `tag` (if any).
name: Apple

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to attach the builds to (e.g. v0.2.0); empty to only keep them as run artifacts
        required: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    steps:
      - uses: actions/checkout@v5

      - name: Rust
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      # GPUI compiles its Metal shaders while building (xcrun metal). Newer
      # Xcodes ship the Metal compiler as a separate download; if it still is
      # not there, GPUI compiles the shaders when the app starts instead.
      - name: Metal compiler
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain || true
          fi
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "FEATURES=" >> "$GITHUB_ENV"
          else
            echo "No Metal compiler: using GPUI's runtime shaders"
            echo "FEATURES=--features runtime-shaders" >> "$GITHUB_ENV"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-${{ matrix.target }}
          # Only the Warm cache workflow saves (every push to main that touches code, and
          # daily): a build here restores it, so a release starts warm.
          save-if: false
          cache-workspace-crates: true
          cache-directories: .warm

      # What the cache was built at: files unchanged since then keep an old time, so Cargo
      # does not rebuild the vendored and workspace crates (#358).
      - name: Cache file times
        run: |
          scripts/ci-cache.sh restore-vendor
          scripts/ci-cache.sh restore-mtimes

      # OpenH264 (videos): x86 assembly for the Intel build when nasm is
      # there (plain C otherwise); the Arm build uses its NEON code as is.
      - name: NASM
        if: matrix.arch == 'x86_64'
        run: brew install nasm || true

      - name: Build
        run: cargo build --release -p morpheus-desktop --locked --target ${{ matrix.target }} $FEATURES

      - name: Package
        run: |
          zip=$(scripts/package-macos.sh ${{ matrix.target }} ${{ matrix.arch }} | tail -1)
          echo "RELEASE_ZIP=$zip" >> "$GITHUB_ENV"
          echo "RELEASE_DMG=${zip%.zip}.dmg" >> "$GITHUB_ENV"

      # The app has to get past loading: a link that drops libwebrtc's
      # Objective-C aborts it before main. (The Intel build runs under
      # Rosetta on the Apple-silicon runner.)
      - name: Starts
        run: |
          if [ "${{ matrix.arch }}" = x86_64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "No Rosetta on this runner; not started"; exit 0
          fi
          rm -rf smoke && mkdir smoke && ditto -x -k "$RELEASE_ZIP" smoke
          exe=smoke/Morpheus.app/Contents/MacOS/morpheus-desktop
          MORPHEUS_DATA_DIR="$PWD/smoke/data" "$exe" > smoke/log.txt 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Morpheus quit within 20s:"; cat smoke/log.txt
            ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i morpheus && \
              head -40 ~/Library/Logs/DiagnosticReports/*morpheus* 2>/dev/null
            exit 1
          fi
          kill "$pid"
          echo "Morpheus is running after 20s"; tail -5 smoke/log.txt

      # One launch asks the keychain once, with 3 accounts (#159): the
      # packaged app against a temporary, unlocked keychain.
      - name: Keychain access count
        if: matrix.arch == 'arm64'
        timeout-minutes: 10
        run: scripts/keychain-self-test.sh smoke/Morpheus.app

      # The camera path (#74), as the app takes it: AVFoundation's cameras
      # listed and, with one, opened as the Settings preview opens it, read
      # for a few seconds and let go. The runner has no camera, so this
      # proves the listing runs and reports zero without crashing (and that
      # no permission prompt is waited on: it is asked only with a camera).
      - name: Camera
        run: |
          if [ "${{ matrix.arch }}" = x86_64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "No Rosetta on this runner; not run"; exit 0
          fi
          out="$RUNNER_TEMP/camera-self-test.txt"
          code=0
          MORPHEUS_CAMERA_SELF_TEST=3 MORPHEUS_CAMERA_SELF_TEST_OUT="$out" MORPHEUS_DATA_DIR="$(mktemp -d)" \
            perl -e 'alarm 120; exec @ARGV' smoke/Morpheus.app/Contents/MacOS/morpheus-desktop || code=$?
          cat "$out" || true
          test "$code" -eq 0
          grep -q "^camera self-test: ok: AVFoundation: " "$out"

      # As a Mac user expects it: its icon, an Edit menu that pastes, one
      # title bar with the traffic lights that drags the window, ⌘W
      # closing the window, and the Dock bringing it back.
      - name: Behaves as a Mac app
        if: matrix.arch == 'arm64'
        timeout-minutes: 10
        run: |
          sleep 2
          bash scripts/mac-check.sh smoke/Morpheus.app

      # The title bar as it is drawn (#284): the window on a shell with no
      # account, a screenshot of the screen kept as an artifact to look at.
      - name: Title bar screenshot
        if: matrix.arch == 'arm64'
        timeout-minutes: 5
        run: |
          mkdir -p shots
          MORPHEUS_TITLEBAR_SHOT=14 MORPHEUS_DATA_DIR="$(mktemp -d)" \
            smoke/Morpheus.app/Contents/MacOS/morpheus-desktop > shots/log.txt 2>&1 &
          pid=$!
          sleep 8
          screencapture -x shots/titlebar.png || true
          wait "$pid" || true
          cat shots/log.txt
          grep -q "^gpu self-check: ok: " shots/log.txt
          ls -l shots

      - uses: actions/upload-artifact@v4
        if: always() && matrix.arch == 'arm64'
        with:
          name: titlebar-shot
          path: shots

      # Update on this platform: the installed bundle finds a newer release
      # on a local feed, swaps itself for it, and the new one starts.
      - name: Update works
        if: matrix.arch == 'arm64'
        run: scripts/update-self-test.sh "$RELEASE_ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_DMG }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" "$RELEASE_ZIP" "$RELEASE_DMG" --clobber

  # A debug build (what `cargo run` makes) never asks the keychain (#159): run
  # headless on a fresh locked keychain with every Security.framework item call
  # logged with its call stack (scripts/keychain-trace.c); any call fails it.
  keychain-debug:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.tag == '' }}
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Rust
        run: rustup show active-toolchain || rustup toolchain install

      - name: Metal compiler
        run: |
          if ! xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain || true
          fi
          if xcrun -sdk macosx metal --version >/dev/null 2>&1; then
            echo "FEATURES=" >> "$GITHUB_ENV"
          else
            echo "FEATURES=--features runtime-shaders" >> "$GITHUB_ENV"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build (debug)
        # No debug info: the cache entry for it was 2 GB.
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build -p morpheus-desktop --locked $FEATURES

      - name: No keychain call
        timeout-minutes: 10
        run: scripts/keychain-debug-check.sh target/debug/morpheus-desktop
