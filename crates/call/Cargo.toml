[package]
name = "morpheus-call"
description = "Morpheus calls: LiveKit media (MatrixRTC transport) and audio devices."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
livekit = { version = "0.9.5", default-features = false, features = ["native", "rustls-tls-webpki-roots"] }
tokio = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
livekit-api = { version = "0.9.0", default-features = false, features = ["access-token"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
