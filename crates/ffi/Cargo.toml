[package]
name = "morpheus-ffi"
description = "UniFFI bindings of the Morpheus core and view-models, for the native Android (Kotlin) and later iOS (Swift) apps."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "morpheus_ffi"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# The binding generator (`just ffi-bindings`); not part of the library.
bindgen = ["uniffi/cli"]

[dependencies]
morpheus-core = { workspace = true }
morpheus-view-model = { workspace = true }
uniffi = "0.32"
tokio = { workspace = true }
futures-util = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# The UniFFI scaffolding is unsafe code (extern functions); the rest of the
# workspace's lints apply.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
