[package]
name = "morpheus-ui"
description = "Shared Dioxus UI for Morpheus. Platform crates pick the renderer."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Test bridge that evaluates JavaScript in the webview on request. See src/e2e.rs.
e2e = ["dep:serde", "tokio/net", "tokio/io-util"]

[dependencies]
# No platform feature here on purpose: apps/desktop and apps/mobile choose.
dioxus = { workspace = true }
morpheus-core = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true, features = ["time", "sync"] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
open = { workspace = true }

# Native file dialogs exist on desktop only; mobile picks files through the
# platform (PLAN.md phase 5).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = { workspace = true }

[lints]
workspace = true
