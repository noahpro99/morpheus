[package]
name = "morpheus-core"
description = "UI-free Matrix client core for Morpheus: sessions, room list, timelines."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
url = "2"
matrix-sdk = { workspace = true }
matrix-sdk-ui = { workspace = true }
ruma-html = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
eyeball-im = { workspace = true }
imbl = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
open = { workspace = true }
directories = { workspace = true }
mime_guess = { workspace = true }
keyring = { workspace = true }
rand = { workspace = true }
chacha20poly1305 = { workspace = true }
base64 = { workspace = true }
# Blurred placeholders for pictures (BlurHash), and reading the pictures
# this app sends to make them.
blurhash = "0.2"
png = { workspace = true }
zune-jpeg = "0.5"
sha2 = "0.10"

# Phones and Windows have no system SQLite to link against (and the dev
# shell's is a Linux desktop build), so the store compiles its own there.
[target.'cfg(any(target_os = "android", target_os = "ios", target_os = "windows"))'.dependencies]
matrix-sdk = { workspace = true, features = ["bundled-sqlite"] }

# Android: certificates are checked against the Mozilla roots (see `session::tls_roots`).
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

[dev-dependencies]
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

# keyring's Apple store will not compile for iPhone without its iOS store.
[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }

# Self-update on desktops: a release is a zip of the app's folder.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate"] }
