[package]
name = "morpheus-core"
description = "UI-free Matrix client core for Morpheus: sessions, room list, timelines."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
matrix-sdk = { workspace = true }
matrix-sdk-ui = { workspace = true }
ruma-html = { workspace = true }
tokio = { workspace = true }
futures-util = { workspace = true }
eyeball-im = { workspace = true }
imbl = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
open = { workspace = true }
directories = { workspace = true }
mime_guess = { workspace = true }
keyring = { workspace = true }
rand = { workspace = true }
chacha20poly1305 = { workspace = true }
base64 = { workspace = true }

# Phones have no system SQLite to link against (and the dev shell's is a
# desktop build), so the store compiles its own there.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
matrix-sdk = { workspace = true, features = ["bundled-sqlite"] }

# Android: certificates are checked against the Mozilla roots (see `session::tls_roots`).
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

[dev-dependencies]
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
