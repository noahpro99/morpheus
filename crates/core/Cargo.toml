[package]
name = "morpheus-core"
description = "UI-free Matrix client core for Morpheus: sessions, room list, timelines."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
url = "2"
matrix-sdk-ui = { workspace = true }
ruma-html = { workspace = true }
futures-util = { workspace = true }
eyeball-im = { workspace = true }
imbl = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
mime_guess = { workspace = true }
rand = { workspace = true }
chacha20poly1305 = { workspace = true }
base64 = { workspace = true }
# Blurred placeholders for pictures (BlurHash), and reading the pictures
# this app sends to make them.
blurhash = "0.2"
png = { workspace = true }
zune-jpeg = "0.5"
sha2 = "0.10"

# Desktops and phones: SQLite stores, the system keyring, a local server for
# SSO, and tokio's runtime.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
matrix-sdk = { workspace = true, features = ["sqlite", "rustls-aws-lc-rs", "sso-login", "experimental-search"] }
tokio = { workspace = true }
open = { workspace = true }
directories = { workspace = true }
keyring = { workspace = true }

# The browser (apps/web): IndexedDB stores, the page's own fetch and timers.
[target.'cfg(target_arch = "wasm32")'.dependencies]
matrix-sdk = { workspace = true, features = ["indexeddb", "js"] }
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
web-time = "1"
web-sys = { version = "0.3", features = ["Window", "Storage", "Navigator", "Location", "Document", "Blob", "Url", "HtmlAnchorElement", "Element"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }

# Phones and Windows have no system SQLite to link against (and the dev
# shell's is a Linux desktop build), so the store compiles its own there.
[target.'cfg(any(target_os = "android", target_os = "ios", target_os = "windows"))'.dependencies]
matrix-sdk = { workspace = true, features = ["bundled-sqlite"] }

# Android: certificates are checked against the Mozilla roots (see `session::tls_roots`).
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

[dev-dependencies]
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true

# keyring's Apple store will not compile for iPhone without its iOS store.
[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }

# Self-update on desktops: a release is a zip of the app's folder.
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
zip = { version = "0.6", default-features = false, features = ["deflate"] }
